<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nova senha | IAGO Shopping</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="password-update">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand-mark" href="/" aria-label="IAGO Shopping">
        <img src="/assets/logos/Logo_IAGO_completa_branca.png" alt="IAGO" class="brand-logo">
        <span class="brand-divider"></span>
        <span class="brand-product">Shopping</span>
      </a>

      <nav class="top-nav" aria-label="Navegação principal">
        <a href="/login/">Login</a>
        <a href="/catalogo/">Catálogo</a>
        <a href="/admin/">Admin</a>
      </nav>
    </header>

    <main class="auth-main">
      <img
        class="hero-scene-image"
        src="/assets/images/hero/tela_login.png"
        alt=""
        aria-hidden="true"
      >
      <section class="auth-panel onboarding-card" aria-label="Definição de nova senha IAGO Shopping">
        <div>
          <span class="eyebrow">Nova senha</span>
          <p>Defina uma senha segura para voltar ao Shopping.</p>
        </div>

        <form class="auth-form" id="password-update-form">
          <label for="new-password">Nova senha</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" placeholder="nova senha" required>

          <label for="confirm-password">Confirmar nova senha</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="confirme a nova senha" required>

          <button class="button primary" type="submit">Alterar senha</button>
          <a class="button secondary" href="/login/">Voltar ao login</a>
        </form>

        <p class="extension-note" id="password-update-message" role="status"></p>
      </section>
    </main>
  </div>

  <script type="module" src="/core/app.js"></script>
</body>
</html>
