<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>IAGO Shopping</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="entry">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand-mark" href="./index.html" aria-label="IAGO Shopping">
        <img src="./assets/logos/Logo_IAGO_completa_branca.png" alt="IAGO" class="brand-logo">
        <span class="brand-divider"></span>
        <span class="brand-product">Shopping</span>
      </a>

      <nav class="top-nav" aria-label="Navegação principal">
        <a href="./index.html" aria-current="page">Entrada</a>
        <a href="./admin.html">Admin</a>
      </nav>
    </header>

    <main>
      <section class="entry-hero onboarding-hero" aria-label="Entrada IAGO Shopping">
        <img
          class="hero-scene-image"
          src="./assets/images/hero/tela_login.png"
          alt=""
          aria-hidden="true"
        >
        <div class="onboarding-card">

          <form class="inline-access-form" id="home-access-form">
            <label for="home-access">E-mail ou telefone</label>
            <input id="home-access" type="text" inputmode="email" autocomplete="email tel" placeholder="seu e-mail ou telefone">
            <label for="home-password">Senha</label>
            <input id="home-password" type="password" autocomplete="current-password" placeholder="sua senha">
            <button class="button primary" type="submit">Entrar no Shopping</button>
          </form>

          <div class="entry-actions" aria-label="Entrada">
            <button class="button secondary" type="button" id="continue-with-google">
              Continuar com Google
            </button>
            <a class="button secondary" href="./catalogo.html" id="continue-without-login">
              Continuar sem login
            </a>
          </div>

          <div class="future-auth-row">
            <a href="./login.html#create-account">Criar conta</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./core/app.js"></script>
</body>
</html>
