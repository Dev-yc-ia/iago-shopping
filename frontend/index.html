<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="IAGO Shopping">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IAGO Shopping">
  <meta property="og:title" content="IAGO Shopping">
  <meta property="og:description" content="IAGO Shopping">
  <meta property="og:url" content="https://ia-go.api.br/">
  <meta property="og:image" content="https://ia-go.api.br/assets/logos/logo_link.png">
  <meta property="og:image:secure_url" content="https://ia-go.api.br/assets/logos/logo_link.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="519">
  <meta property="og:image:height" content="506">
  <meta property="og:image:alt" content="IAGO Shopping">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="IAGO Shopping">
  <meta name="twitter:description" content="IAGO Shopping">
  <meta name="twitter:image" content="https://ia-go.api.br/assets/logos/logo_link.png">

  <title>IAGO Shopping</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="entry">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand-mark" href="/" aria-label="IAGO Shopping">
        <img src="/assets/logos/Logo_IAGO_completa_branca.png" alt="IAGO" class="brand-logo">
        <span class="brand-divider"></span>
        <span class="brand-product">Shopping</span>
      </a>

      <nav class="top-nav" aria-label="Navegação principal">
        <a href="/login/">Login</a>
        <a href="/catalogo/">Catálogo</a>
        <a href="/admin/" hidden>Admin</a>
      </nav>
    </header>

    <main>
      <section class="entry-hero onboarding-hero" aria-label="Login IAGO Shopping">
        <img
          class="hero-scene-image"
          src="/assets/images/hero/tela_login.png"
          alt=""
          aria-hidden="true"
        >
        <div class="onboarding-card entry-login-card">

          <form class="inline-access-form" id="home-access-form">
            <label for="home-access">E-mail ou telefone</label>
            <input id="home-access" type="text" inputmode="email" autocomplete="email tel" placeholder="seu e-mail ou telefone">
            <label for="home-password">Senha</label>
            <div class="entry-password-field">
              <input id="home-password" type="password" autocomplete="current-password" placeholder="sua senha">
              <button class="entry-password-toggle" type="button" aria-label="Mostrar senha" aria-controls="home-password" aria-pressed="false">
                <svg class="entry-eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.8 12s3.2-5.5 9.2-5.5S21.2 12 21.2 12 18 17.5 12 17.5 2.8 12 2.8 12Z"></path>
                  <circle cx="12" cy="12" r="2.4"></circle>
                </svg>
              </button>
            </div>
            <button class="button primary entry-primary-submit" type="submit">
              <span class="entry-button-label">Entrar no Shopping</span>
            </button>
          </form>

          <div class="entry-actions" aria-label="Login">
            <button class="button secondary entry-secondary-action entry-google-action" type="button" id="continue-with-google">
              <span class="entry-button-label">Continuar com Google</span>
            </button>
            <a class="button secondary entry-secondary-action entry-guest-action" href="/catalogo/" id="continue-without-login">
              <span class="entry-button-label">Continuar sem login</span>
            </a>
          </div>

          <div class="future-auth-row entry-account-links">
            <a href="/recuperar-senha/">Esqueceu sua senha?</a>
            <a href="/login/#create-account">Criar conta</a>
          </div>

          <div class="entry-card-divider" aria-hidden="true"></div>

          <div class="entry-seller-box">
            <span class="entry-seller-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 10.2 5.2 5h13.6l1.2 5.2"></path>
                <path d="M5 10.2v7.6A1.2 1.2 0 0 0 6.2 19h11.6a1.2 1.2 0 0 0 1.2-1.2v-7.6"></path>
                <path d="M8 19v-5h8v5"></path>
                <path d="M4 10.2h16"></path>
              </svg>
            </span>
            <div class="entry-seller-content">
              <span>Quer vender seus produtos?</span>
              <a class="button ghost entry-seller-button" href="/cadastro-parceiro/">
                <span class="entry-button-label">Seja vendedor IAGO</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/core/app.js"></script>
</body>
</html>
