<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Login | IAGO Shopping</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand-mark" href="/" aria-label="IAGO Shopping">
        <img src="/assets/logos/Logo_IAGO_completa_branca.png" alt="IAGO" class="brand-logo">
        <span class="brand-divider"></span>
        <span class="brand-product">Shopping</span>
      </a>

      <nav class="top-nav" aria-label="Navegação principal">
        <a href="/login/">Login</a>
        <a href="/catalogo/">Catálogo</a>
        <a href="/admin/" hidden>Admin</a>
      </nav>
    </header>

    <main class="auth-main">
      <img
        class="hero-scene-image"
        src="/assets/images/hero/tela_login.png"
        alt=""
        aria-hidden="true"
      >
      <section class="auth-panel onboarding-card" aria-label="Login IAGO Shopping">
        <p class="auth-notice" data-login-notice hidden></p>

        <form class="auth-form" id="login-form">
          <label for="login-access">E-mail ou telefone</label>
          <input id="login-access" type="text" inputmode="email" autocomplete="email tel" placeholder="seu e-mail ou telefone">

          <label for="login-password">Senha</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="sua senha">

          <button class="button primary" type="submit">Entrar no Shopping</button>
          <button class="button ghost" type="button" id="google-login-button">Continuar com Google</button>
          <a class="button secondary" href="/catalogo/" data-continue-link>Continuar sem login</a>
        </form>

        <div class="account-links" id="create-account">
          <a href="/recuperar-senha/">Esqueci minha senha</a>
          <a href="#create-account" data-signup-toggle>Criar conta de cliente</a>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/core/app.js"></script>
</body>
</html>
