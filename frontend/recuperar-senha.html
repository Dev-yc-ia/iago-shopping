<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Recuperar senha | IAGO Shopping</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="password-recovery">
  <div class="app-shell">
    <header class="app-header">
      <a class="brand-mark" href="./index.html" aria-label="IAGO Shopping">
        <img src="./assets/logos/Logo_IAGO_completa_branca.png" alt="IAGO" class="brand-logo">
        <span class="brand-divider"></span>
        <span class="brand-product">Shopping</span>
      </a>

      <nav class="top-nav" aria-label="Navegação principal">
        <a href="./index.html">Entrada</a>
        <a href="./catalogo.html">Catálogo</a>
        <a href="./admin.html">Admin</a>
      </nav>
    </header>

    <main class="auth-main">
      <img
        class="hero-scene-image"
        src="./assets/images/hero/tela_login.png"
        alt=""
        aria-hidden="true"
      >
      <section class="auth-panel onboarding-card" aria-label="Recuperação de senha IAGO Shopping">
        <div>
          <span class="eyebrow">Recuperar senha</span>
          <p>Informe o e-mail cadastrado para receber o link de redefinição.</p>
        </div>

        <form class="auth-form" id="password-recovery-form">
          <label for="recovery-email">E-mail cadastrado</label>
          <input id="recovery-email" name="email" type="email" autocomplete="email" placeholder="seu e-mail" required>

          <button class="button primary" type="submit">Enviar e-mail</button>
          <a class="button secondary" href="./login.html">Voltar ao login</a>
        </form>

        <p class="extension-note" id="password-recovery-message" role="status"></p>
      </section>
    </main>
  </div>

  <script type="module" src="./core/app.js"></script>
</body>
</html>
